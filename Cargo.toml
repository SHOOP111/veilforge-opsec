[package]
name = "veilforge"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Offline, privacy-preserving defensive OPSEC auditor"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SHOOP111/veilforge-opsec"
readme = "README.md"
keywords = ["security", "privacy", "opsec", "windows", "sarif"]
categories = ["command-line-utilities", "development-tools"]

# Isolate this repository from any Cargo project in its parent directory.
[workspace]

[dependencies]
anyhow = "1.0"
blake3 = "1.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
rand = "0.8"
rayon = "1.10"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.15"
toml = "0.8"
walkdir = "2.5"
zeroize = { version = "1.8", features = ["derive"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
